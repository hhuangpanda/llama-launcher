[project]
name = "llama-launcher"
version = "0.1.0"
description = "Windows tray app that runs local GGUF models through llama-server"
requires-python = ">=3.13"
dependencies = ["PySide6-Essentials>=6.12", "tomlkit>=0.15"]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-qt>=4.5", "pytest-timeout>=2.4"]
build = ["pyinstaller>=6"]

[project.gui-scripts]
llama-launcher = "llama_launcher.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llama_launcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real'"
markers = ["real: uses the real llama-server builds and models (opt-in: pytest -m real)"]
timeout = 60
qt_api = "pyside6"
