[project]
name = "llama-launcher"
version = "0.1.0"
description = "Windows tray app that runs local GGUF models through llama-server"
requires-python = ">=3.13"
classifiers = ["Operating System :: Microsoft :: Windows", "Environment :: Win32 (MS Windows)"]
dependencies = ["PySide6-Essentials>=6.12", "tomlkit>=0.15"]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-qt>=4.5", "pytest-timeout>=2.4", "ruff>=0.14"]
build = ["pyinstaller>=6"]

[project.gui-scripts]
llama-launcher = "llama_launcher.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llama_launcher*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is the formatter's job
    "N802",    # Qt overrides are camelCase (closeEvent, mouseReleaseEvent)
    "SIM105",  # try/except/pass reads fine; contextlib.suppress isn't clearer
]

[tool.ruff.lint.isort]
known-first-party = ["llama_launcher"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
addopts = "-m 'not real'"
markers = ["real: uses the real llama-server builds and models (opt-in: pytest -m real)"]
timeout = 60
qt_api = "pyside6"
