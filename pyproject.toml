[project]
name = "llama-launcher"
version = "0.2.0"
description = "Windows tray app to manage and launch local GGUF models with llama-server, using per-model profiles and your own llama.cpp builds"
requires-python = ">=3.13"
readme = "README.md"
authors = [{ name = "hhuangpanda" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llama.cpp", "llama-server", "gguf", "llm", "tray", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = ["PySide6-Essentials>=6.12", "tomlkit>=0.15"]

[project.urls]
Homepage = "https://github.com/hhuangpanda/llama-launcher"

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-qt>=4.5", "pytest-timeout>=2.4", "ruff>=0.14"]
build = ["pyinstaller>=6"]

[project.gui-scripts]
llama-launcher = "llama_launcher.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llama_launcher*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is the formatter's job
    "N802",    # Qt overrides are camelCase (closeEvent, mouseReleaseEvent)
    "SIM105",  # try/except/pass reads fine; contextlib.suppress isn't clearer
]

[tool.ruff.lint.isort]
known-first-party = ["llama_launcher"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
addopts = "-m 'not real'"
markers = ["real: uses the real llama-server builds and models (opt-in: pytest -m real)"]
timeout = 60
qt_api = "pyside6"
